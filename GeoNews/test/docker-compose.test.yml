# GeoNews Playwright / mock stack
# Usage (from GeoNews root):
#   docker compose -f test/docker-compose.test.yml up -d --build
#   cd test && npm test
#   docker compose -f test/docker-compose.test.yml down   # keeps volume (no -v)
#
# Forces LLM_MOCK + INGEST_MOCK regardless of host .env keys.
# Reuses image geonews:local and named volume geonews-data.
# Playwright browsers stay on the host (npm in test/) — never in the production image.
#
# If port 8000 is already in use by the main compose stack with mocks, skip this
# file and run `npm test` against that stack instead (see README.md).

services:
  geonews:
    build:
      context: ..
      dockerfile: Dockerfile
    image: geonews:local
    container_name: geonews-e2e
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      LLM_MOCK: "true"
      INGEST_MOCK: "true"
      OPENROUTER_API_KEY: ""
    volumes:
      - geonews-data:/app/db
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

volumes:
  geonews-data:
    name: geonews-data
