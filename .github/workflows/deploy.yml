name: Deploy AI-Code Workspace to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build NDA Generator Frontend
        run: |
          cd nda-generator/frontend
          npm ci
          npm run build

      - name: Build Kanban Gemini Frontend
        run: |
          cd kanban-gemini/frontend
          npm ci
          npm run build

      - name: Build Portfolio Frontend
        run: |
          cd portfolio
          npm ci
          npm run build

      - name: Build Learning App Frontend
        run: |
          cd learning
          npm ci
          npm run build

      - name: Assemble Static Site Portfolio
        run: |
          mkdir -p public_site/nda-generator public_site/kanban-gemini public_site/portfolio public_site/learning public_site/agentic-workflow
          cp index.html public_site/
          cp -r nda-generator/frontend/dist/* public_site/nda-generator/
          cp -r kanban-gemini/frontend/out/* public_site/kanban-gemini/
          cp -r portfolio/out/* public_site/portfolio/
          cp -r learning/dist/* public_site/learning/
          cp agentic-workflow/index.html public_site/agentic-workflow/

      - name: Deploy to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public_site
          publish_branch: gh-pages
          force_orphan: true
