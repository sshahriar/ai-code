name: Deploy AI-Code Workspace to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: nda-generator/frontend/package-lock.json

      - name: Install & Build NDA Generator Frontend
        run: |
          cd nda-generator/frontend
          npm ci
          npm run build

      - name: Assemble Static Site Portfolio
        run: |
          mkdir -p public_site/nda-generator
          cp index.html public_site/
          cp -r nda-generator/frontend/dist/* public_site/nda-generator/

      - name: Deploy to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public_site
          publish_branch: gh-pages
          force_orphan: true
