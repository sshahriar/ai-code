services:
  backend:
    build: ./backend
    container_name: kanban-backend
    ports:
      - "4000:4000"
    volumes:
      - kanban-data:/app/data
    environment:
      - PORT=4000
      - DB_PATH=/app/data/kanban.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:4000/api
    container_name: kanban-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  kanban-data:
